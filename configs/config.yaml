schema_version: "2024-07-01"
strategy_version: "basic-v1"

events:
  driver: "memory"
  redis_url: ""
  redis_prefix: "phoenix"
  redis_group: "phoenix-consumer"

chains:
  - id: 11155111
    name: "sepolia"
    rpc: "https://ethereum-sepolia.publicnode.com"

pools:
  - id: "tusd-weth-005"
    chain_id: 11155111
    token0: "0x3E49DB88bC85135b6F716E5CD573cDd42b8640c5"
    token1: "0x7b79995e5f793A07Bc00c21412e50Ecae098E7f9"
    token0_decimals: 6
    token1_decimals: 18
    fee: 500
    address: "0x1E80b0b6d12Ecf2CDD08bC9c66f2fD594394331d"
    max_investment: "0.5"
    position_manager: "0x1238536071E1c677A632429e3655c799b22cDA52"
    amount0: "100000000"          # 100 TUSD (6 decimals)
    amount1: "31500000000000000"  # 0.0315 WETH

strategy:
  name: "basic_rebalance"
  dry_run: true
  params:
    threshold: 0.05
    # V3 tick-range rebalance strategy (used only when STRAT_V3_ENABLED=1 or env overrides enable it)
    STRAT_V3_ENABLED: 0
    STRAT_V3_WIDTH_TICKS: 600
    STRAT_V3_EDGE_BUFFER_TICKS: 60
    STRAT_V3_COOLDOWN_SEC: 300
    STRAT_V3_MIN_TICK_MOVE: 30
    STRAT_V3_TICK_SPACING: 60
    # Optional assumed position range (to test triggers without reading wallet positions)
    # STRAT_V3_ASSUMED_LOWER_TICK: -120000
    # STRAT_V3_ASSUMED_UPPER_TICK: -119400

risk:
  max_daily_gas: 1.0
  max_drawdown: 0.10
  consecutive_fails: 5

monitoring:
  port: 8080
